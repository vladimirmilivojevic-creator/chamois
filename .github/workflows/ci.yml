name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, Clippy, cargo test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scheduler
      - run: cargo fmt --check
      - name: Clippy (pure Rust core)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (with PyO3 bindings)
        run: cargo clippy --features python -- -D warnings
      - run: cargo test

  python:
    name: Python (Ruff, mypy, pytest + Hypothesis on the Rust build)
    runs-on: ubuntu-latest
    env:
      CHAMOIS_REQUIRE_RUST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scheduler
      - name: Install (builds the Rust extension with maturin)
        run: |
          uv venv
          uv pip install ./scheduler -e ".[qiskit,plot,dev]"
      - name: Rust extension is importable
        run: uv run --no-sync python -c "import chamois_scheduler as s; print('chamois_scheduler', s.__version__)"
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - name: pytest (coverage gate 85%)
        run: uv run --no-sync pytest

  docs:
    name: MkDocs (strict build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mkdocs-material>=9.5,<10"
      - run: mkdocs build --strict

  docker:
    name: Docker Compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build api
      - name: Smoke test the image
        run: |
          docker run -d --name chamois -p 8000:8000 chamois-api
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/health | grep '"scheduler":"rust"'
          docker logs chamois
