# The free Render instance sleeps after 15 minutes without traffic.
# Keep the demo awake on weekdays, roughly 07:00-20:00 Vienna time.
name: Keep demo awake

on:
  schedule:
    - cron: "*/5 6-18 * * 1-5"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: Ping /health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.API_URL }}/health"
