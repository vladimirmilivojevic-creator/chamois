services:
  api:
    build: .
    image: chamois-api
    ports:
      - "8000:8000"
    environment:
      # 1.0 = the simulated device takes as long as the real shots would
      CHAMOIS_TIME_SCALE: "1.0"
    restart: unless-stopped

  docs:
    image: squidfunk/mkdocs-material:9.5.49
    volumes:
      - .:/docs
    ports:
      - "8001:8000"
    command: ["serve", "--dev-addr=0.0.0.0:8000"]
