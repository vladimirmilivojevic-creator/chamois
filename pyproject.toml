[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "chamois"
version = "0.1.0"
description = "Mini control stack for a simulated trapped-ion quantum computer: ARNICA-style job API, Rust pulse scheduler, simulated device."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vladimir Milivojevic" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "numpy>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
qiskit = ["qiskit>=2.0", "qiskit-aqt-provider>=2.0"]
plot = ["matplotlib>=3.9"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "maturin>=1.7,<2",
    "pre-commit>=3.8",
]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
chamois = "chamois.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["chamois"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=chamois --cov-report=term-missing --cov-fail-under=85"
filterwarnings = ["ignore::DeprecationWarning:qiskit.*"]

[tool.coverage.run]
branch = true
concurrency = ["thread"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["chamois"]

[[tool.mypy.overrides]]
module = ["chamois_scheduler", "qiskit.*", "qiskit_aqt_provider.*", "matplotlib.*"]
ignore_missing_imports = true
